bind 0.0.0.0
protected-mode yes
port 6379
timeout 0
tcp-keepalive 300

# 本地开发也开启 AOF，重启容器后保留房间临时状态。
appendonly yes
appendfsync everysec
dir /data

# 房间销毁不依赖 keyspace notification；避免将非可靠事件当作任务队列。
notify-keyspace-events ""

# 开发环境上限；生产环境应按容量规划调整，并使用 noeviction 保护状态正确性。
maxmemory 256mb
maxmemory-policy noeviction

